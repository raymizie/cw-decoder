services:
  - type: web
    name: cw-decoder-whatsapp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOW_GROUP_AUDIO
        value: "false"
      - key: MAX_SESSIONS
        value: "10"
      - key: SESSION_TTL_MINUTES
        value: "60"
      - key: KEEPALIVE_URLS
        value: ""
